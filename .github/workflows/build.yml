name: Build nhKRNL

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag Name'
        required: true
        default: 'v1.0.2-susfs'

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [c2s, c2slte, c1s, c1slte, z3s, y2s, y2slte, x1s, x1slte, r8s]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt clean

      - name: Update KernelSU-Next to latest version
        run: |
          echo "Updating KernelSU-Next submodule to the latest version..."
          # Identify the KernelSU directory
          KSU_DIR=""
          if [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          elif [ -d "drivers/kernelsu" ]; then
            KSU_DIR="drivers/kernelsu"
          elif [ -d "KernelSU-Next" ]; then
            KSU_DIR="KernelSU-Next"
          fi

          if [ -n "$KSU_DIR" ]; then
            cd "$KSU_DIR"
            git fetch origin
            # Switch to the active branch (next, main, or master) and pull latest changes
            git checkout next 2>/dev/null || git checkout main 2>/dev/null || git checkout master 2>/dev/null
            git pull origin $(git branch --show-current)
            echo "KernelSU-Next successfully updated to commit: $(git rev-parse --short HEAD)"
            cd -
          else
            echo "KernelSU directory not found. Skipping update."
          fi

      - name: Set Kernel Localversion (nhKRNL)
        run: |
          echo "Applying -nhKRNL suffix to all defconfigs..."
          find arch/arm64/configs/ -type f -name "*defconfig" -exec sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-nhKRNL"/' {} +

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build kernel (${{ matrix.target }})
        run: |
          ./build.sh -m ${{ matrix.target }} -k y -r n

      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: nhKRNL-${{ matrix.target }}
          path: build/out/${{ matrix.target }}/*.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Retrieve artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts

      - name: Prepare release files
        run: |
          mkdir -p final_artifacts
          find raw_artifacts/ -name "*.zip" -exec cp {} final_artifacts/ \;
          echo "Files ready for release:"
          ls -lh final_artifacts/

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          name: "Release: ${{ github.event.inputs.tag }}"
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "final_artifacts/*.zip"
          body: |
            ## nhKRNL Official Release
            * **Tag:** `${{ github.event.inputs.tag }}`
            * **Kernel Identifier:** `nhKRNL`
            * **Features:** Latest KernelSU-Next + SuSFS Integration
            
            ### Supported Devices & Codenames
            **Galaxy S20 Series:**
            * Galaxy S20 5G / LTE (`x1s` / `x1slte`)
            * Galaxy S20+ 5G / LTE (`y2s` / `y2slte`)
            * Galaxy S20 Ultra (`z3s`)
            
            **Galaxy Note 20 Series:**
            * Galaxy Note 20 5G / LTE (`c1s` / `c1slte`)
            * Galaxy Note 20 Ultra 5G / LTE (`c2s` / `c2slte`)
            
            **Galaxy S20 FE:**
            * Galaxy S20 FE Exynos (`r8s`)
            
            *Please verify your device codename before flashing.*
