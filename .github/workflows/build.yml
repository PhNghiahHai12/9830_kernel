name: Build nhKRNL

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag Name'
        required: true
        default: 'v0.0.2-stable'

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [c2s, c2slte, c1s, c1slte, z3s, y2s, y2slte, x1s, x1slte]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt clean

      - name: Force KernelSU-Next to official v3.4.2
        run: |
          echo "Switching KernelSU-Next to official tag v3.4.2..."
          
          KSU_DIR=""
          if [ -d "KernelSU-Next" ]; then KSU_DIR="KernelSU-Next"; elif [ -d "drivers/kernelsu" ]; then KSU_DIR="drivers/kernelsu"; fi
          
          if [ -n "$KSU_DIR" ]; then
            cd "$KSU_DIR"
            # Fetch tags directly from the official upstream repository to bypass outdated forks
            git fetch https://github.com/rifsxd/KernelSU-Next.git --tags
            
            # Force checkout the specific v3.4.2 tag
            git checkout v3.4.2
            git clean -fdx
            
            echo "KernelSU-Next is now at: $(git describe --tags --always) - Commit: $(git rev-parse --short HEAD)"
            cd -
          else
            echo "KernelSU directory not found!"
          fi

      - name: Set Kernel Localversion (-nhKRNL)
        run: |
          echo "Applying -nhKRNL suffix to all defconfigs..."
          find arch/arm64/configs/ -type f -name "*defconfig" -exec sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-nhKRNL"/' {} +

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Execute kernel compilation (${{ matrix.target }})
        run: |
          ./build.sh -m ${{ matrix.target }} -k y -r n

      - name: Upload compiled artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: nhKRNL-${{ matrix.target }}
          path: build/out/${{ matrix.target }}/*.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Retrieve compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts

      - name: Prepare and consolidate release files
        run: |
          mkdir -p final_artifacts
          find raw_artifacts/ -name "*.zip" -exec cp {} final_artifacts/ \;
          echo "Files ready for GitHub Release:"
          ls -lh final_artifacts/

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          name: "Release: ${{ github.event.inputs.tag }}"
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "final_artifacts/*.zip"
          body: |
            ## nhKRNL Official Release
            * **Tag:** `${{ github.event.inputs.tag }}`
            * **Kernel Identifier:** `nhKRNL`
            * **Features:** Official KernelSU-Next (v3.4.2) + SuSFS Integration
            
            ### Supported Devices & Codenames
            **Galaxy S20 Series:**
            * Galaxy S20 5G / LTE (`x1s` / `x1slte`)
            * Galaxy S20+ 5G / LTE (`y2s` / `y2slte`)
            * Galaxy S20 Ultra (`z3s`)
            
            **Galaxy Note 20 Series:**
            * Galaxy Note 20 5G / LTE (`c1s` / `c1slte`)
            * Galaxy Note 20 Ultra 5G / LTE (`c2s` / `c2slte`)
            
            *Please verify your device codename before flashing.*
